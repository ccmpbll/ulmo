name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  self-checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run self-checks
        run: ./tests/run_all.sh
