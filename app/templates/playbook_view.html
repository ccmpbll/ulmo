{% extends "base.html" %}
{% block title %}{{ rel_path }} - ulmo{% endblock %}
{% block content %}
<div class="page-header">
  <h1>{{ rel_path }}</h1>
  <div class="actions">
    <a class="btn secondary" href="/files/edit?path={{ rel_path | urlencode }}">Edit</a>
    <a class="btn secondary" href="/ansible">Back to playbooks</a>
  </div>
</div>

<div class="card" style="padding:0; overflow:hidden;">
  <div class="code-view">
    <pre class="code-nums" aria-hidden="true">{{ line_numbers }}</pre>
    <pre class="code-body" style="overflow-x:auto;"><code class="language-yaml" id="playbook-code">{{ content }}</code></pre>
  </div>
</div>

<link rel="stylesheet" href="/static/vendor/atom-one-dark.min.css">
<script src="/static/vendor/highlight.min.js"></script>
<script>
  hljs.highlightElement(document.getElementById("playbook-code"));
</script>
{% endblock %}
